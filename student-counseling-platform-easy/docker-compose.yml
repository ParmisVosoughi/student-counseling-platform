services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-counseling}
      POSTGRES_USER: ${POSTGRES_USER:-counseling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CounselingLocal2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-key-change-before-production-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-counseling}
      POSTGRES_USER: ${POSTGRES_USER:-counseling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CounselingLocal2026!}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18088}
      TIME_ZONE: ${TIME_ZONE:-Asia/Tehran}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      AUTO_SEED_DEMO: ${AUTO_SEED_DEMO:-True}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
